name: medir-forma-a

on:
  push:
    branches: [task/validacion-repo/actions]

permissions:
  contents: read

concurrency:
  group: medir-a-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  todo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('api/**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            mcp/package-lock.json
            panel/package-lock.json
      - run: make check
