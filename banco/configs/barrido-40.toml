# Tarea 12 (D-067): barrido de 40 preguntas. Grupo de 20 buscadores, curvas por submuestreo y frontera de un solo buscador.
name = "barrido-40"
archives = ["ficticio"]
battery = "desarrollo"
mode = "explore"
sample = { size = 40, strata = "tipo", seed = 7, include = ["Q138", "Q147", "Q153"] }
repetitions = 1
budgetUsd = 5.5
concurrency = 4

[[searchers]]
approach = "main"
count = 10
model = "haiku"

[[searchers]]
approach = "topic"
count = 5
model = "haiku"

[[searchers]]
approach = "synonyms"
count = 5
model = "haiku"

[combiner]
kind = "majorityVote"

# El barrido no juzga (solo run lo hace); la configuración exige al menos un juez: uno local y gratuito que no se lanza.
[[judges]]
rubric = "strict"
count = 1
model = "ollama:qwen3.5:9b"
think = false

[judging]
aggregation = "majority"

[sweep]
mixes = [
  { main = 1 }, { main = 2 }, { main = 3 }, { main = 4 }, { main = 5 },
  { main = 1, topic = 1, synonyms = 1 },
  { main = 2, topic = 1, synonyms = 1 },
  { main = 3, topic = 1, synonyms = 1 },
  { main = 10, topic = 5, synonyms = 5 },
]
draws = 20
singleMaxTurns = [10, 20, 40]
