openapi: 3.1.0
info:
  title: Servicio lector de Odín
  version: 1.0.0
  description: >-
    Contrato HTTP del servicio lector que usa Odín para convertir documentos
    (PDF, PNG, JPEG, TIFF) en texto por página. Lo implementa el puente OCR;
    Odín lo consume. Los ejemplos de `ejemplos/servicio-lector/` son las
    respuestas de referencia que comprueban las pruebas del puente.
security:
  - bearerAuth: []
  - {}
paths:
  /read:
    post:
      summary: Lee un documento y devuelve el texto de cada página.
      description: >-
        Todas las páginas van en la respuesta, numeradas desde 1 y sin huecos.
        El texto de una página puede venir vacío. Si alguna página no se puede
        leer, no se devuelve ninguna página.
      operationId: readDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Documento a leer (PDF, PNG, JPEG o TIFF).
      responses:
        '200':
          description: Páginas leídas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
              examples:
                read200:
                  summary: Dos páginas, la segunda vacía.
                  value:
                    pages:
                      - number: 1
                        text: Texto de ejemplo de la primera página.
                      - number: 2
                        text: ''
                    reader:
                      name: unlimited-ocr-2
                      version: mlx-community/Unlimited-OCR-2-8bit; uocr 0.1.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/Unreadable'
        '500':
          $ref: '#/components/responses/ReaderFailed'
  /health:
    get:
      summary: Estado del servicio y del lector.
      description: Responde 200 cuando el modelo está cargado.
      operationId: getHealth
      responses:
        '200':
          description: Servicio listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                health200:
                  summary: Modelo cargado.
                  value:
                    status: ok
                    reader:
                      name: unlimited-ocr-2
                      version: mlx-community/Unlimited-OCR-2-8bit; uocr 0.1.0
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Solo si el servicio se arrancó con secreto. Odín lo envía si
        `ODIN_READER_TOKEN` tiene valor.
  responses:
    BadRequest:
      description: Falta el campo `file` o el cuerpo no es multipart.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read400:
              summary: Falta el campo file.
              value:
                error: bad_request
                detail: Falta el campo file o el cuerpo no es multipart/form-data.
    Unauthorized:
      description: >-
        El servicio se arrancó con secreto y la petición no envía
        `Authorization: Bearer <secreto>`. Afecta a las dos rutas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read401:
              summary: Sin secreto.
              value:
                error: unauthorized
                detail: "El servicio requiere Authorization: Bearer con su secreto."
    TooLarge:
      description: El fichero supera el máximo del servicio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read413:
              summary: Fichero demasiado grande.
              value:
                error: too_large
                detail: El fichero supera el tamaño máximo que admite el servicio.
    Unsupported:
      description: El fichero no es PDF, PNG, JPEG ni TIFF.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read415:
              summary: Formato no admitido.
              value:
                error: unsupported
                detail: El fichero no es PDF, PNG, JPEG ni TIFF.
    Unreadable:
      description: El fichero está dañado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read422:
              summary: Fichero dañado.
              value:
                error: unreadable
                detail: El fichero está dañado y no se puede leer.
    ReaderFailed:
      description: >-
        Alguna página no se pudo leer. No se devuelve ninguna página.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            read500:
              summary: Fallo del lector.
              value:
                error: reader_failed
                detail: Alguna página no se pudo leer; no se devuelve ninguna página.
  schemas:
    Reader:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
        version:
          type: string
    ReadResponse:
      type: object
      required:
        - pages
        - reader
      properties:
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
        reader:
          $ref: '#/components/schemas/Reader'
    Page:
      type: object
      required:
        - number
        - text
      properties:
        number:
          type: integer
          minimum: 1
        text:
          type: string
          description: Puede venir vacío.
    HealthResponse:
      type: object
      required:
        - status
        - reader
      properties:
        status:
          type: string
          enum:
            - ok
        reader:
          $ref: '#/components/schemas/Reader'
    ErrorResponse:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
          enum:
            - bad_request
            - unauthorized
            - too_large
            - unsupported
            - unreadable
            - reader_failed
        detail:
          type: string
          description: Motivo, sin texto del documento.
